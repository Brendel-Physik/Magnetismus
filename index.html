<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geheimnis Magnet Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@600;700&display=swap">
<script>
  // Gemerkte Darstellung setzen, bevor die Seite gezeichnet wird, damit nichts aufblitzt
  try {
    const mode = localStorage.getItem('magnetQuiz.mode');
    if (mode === 'dark' || mode === 'light') document.documentElement.dataset.mode = mode;
    if (localStorage.getItem('magnetQuiz.cb') === '1') document.documentElement.dataset.cb = 'on';
  } catch (e) { /* Speicher gesperrt */ }
</script>
<style>
  :root{
    --paper:#F3F6F8; --grid:rgba(45,95,150,.09);
    --surface:#FFFFFF; --surface-2:#F2F5F9;
    --ink:#172033; --ink-soft:#56627A; --line:#D5DDE7;
    --pen:#2340B0; --pen-soft:#E7ECFC; --on-pen:#FFFFFF;
    --north:#D2362F; --south:#23855A; --steel:#8A94A2;
    --ruler:#F2E6B8; --ruler-line:#8C7A3E;
    --wood:#B98550; --copper:#C0703F; --gold:#D6B14A; --alu:#DCE1E7; --alu-line:#98A2AE; --kgrid:rgba(45,95,150,.16);
    --ok:#1C7A4C; --ok-bg:#E2F3E9; --bad:#BD3029; --bad-bg:#FBE8E6; --part:#935F00; --part-bg:#FCF1DA;
    --shadow:0 1px 2px rgba(23,32,51,.06), 0 10px 30px rgba(23,32,51,.07);
    --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
    --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
    --f-hand:"Caveat","Segoe Print","Chalkboard SE","Comic Sans MS",cursive;
  }
  /* Dunkel nach Gerät oder Umgebung (data-theme), außer man hat im Quiz selbst gewählt (data-mode) */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]):not([data-mode="light"]){
      color-scheme:dark;
      --paper:#0F131A; --grid:rgba(130,160,210,.07);
      --surface:#181E28; --surface-2:#1F2633;
      --ink:#E6EAF2; --ink-soft:#9DA8BB; --line:#2E3747;
      --pen:#8EA4FF; --pen-soft:#222C4B; --on-pen:#0D1220;
      --north:#E0514A; --south:#35A874; --steel:#7F8999;
      --ruler:#3A3422; --ruler-line:#C4B173;
      --wood:#C49462; --copper:#D08355; --gold:#C9A43A; --alu:#5E6775; --alu-line:#8C96A6; --kgrid:rgba(140,170,220,.14);
      --ok:#62CC95; --ok-bg:#15301F; --bad:#FF8077; --bad-bg:#3A1917; --part:#F0B44C; --part-bg:#352813;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]:not([data-mode="light"]), :root[data-mode="dark"]{
    color-scheme:dark;
    --paper:#0F131A; --grid:rgba(130,160,210,.07);
    --surface:#181E28; --surface-2:#1F2633;
    --ink:#E6EAF2; --ink-soft:#9DA8BB; --line:#2E3747;
    --pen:#8EA4FF; --pen-soft:#222C4B; --on-pen:#0D1220;
    --north:#E0514A; --south:#35A874; --steel:#7F8999;
    --ruler:#3A3422; --ruler-line:#C4B173;
    --wood:#C49462; --copper:#D08355; --gold:#C9A43A; --alu:#5E6775; --alu-line:#8C96A6; --kgrid:rgba(140,170,220,.14);
    --ok:#62CC95; --ok-bg:#15301F; --bad:#FF8077; --bad-bg:#3A1917; --part:#F0B44C; --part-bg:#352813;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }

  /* Farbenblind-Modus: Rot/Grün wird zu Orange/Blau, Teilerfolg wird neutral grau */
  :root[data-cb="on"]{
    --north:#C85200; --south:#0072B2;
    --ok:#0065A8; --ok-bg:#E1EEF9; --bad:#B34A00; --bad-bg:#FCEBDD; --part:#56627A; --part-bg:#EEF1F5;
  }
  @media (prefers-color-scheme: dark){
    :root[data-cb="on"]:not([data-theme="light"]):not([data-mode="light"]){
      --north:#D96A1E; --south:#3F97CF;
      --ok:#6CBDF0; --ok-bg:#10283A; --bad:#F2A054; --bad-bg:#3A2512; --part:#A3AEC0; --part-bg:#252C38;
    }
  }
  :root[data-theme="dark"][data-cb="on"]:not([data-mode="light"]), :root[data-mode="dark"][data-cb="on"]{
    --north:#D96A1E; --south:#3F97CF;
    --ok:#6CBDF0; --ok-bg:#10283A; --bad:#F2A054; --bad-bg:#3A2512; --part:#A3AEC0; --part-bg:#252C38;
  }

  *{ box-sizing:border-box; }
  /* iPad/iPhone: kein Zoomen bei schnellem Doppeltippen, kein grauer Tipp-Blitz, keine größere Schrift im Querformat.
     Langes Drücken auf Knöpfe markiert keinen Text und öffnet kein Menü. Zwei-Finger-Zoom bleibt erlaubt. */
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; touch-action:manipulation; }
  button, input{ touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  button{ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  body{
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:20px 20px;
    color:var(--ink);
    font-family:var(--f-body);
    font-size:17px;
    line-height:1.5;
  }
  :focus-visible{ outline:3px solid var(--pen); outline-offset:2px; }

  /* Seitenrand hält im Querformat Abstand zur Notch */
  .wrap{ max-width:720px; margin:0 auto; padding-block:24px 40px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); display:flex; flex-direction:column; gap:18px; }

  /* Nur auf schmalen Bildschirmen: .lg zeigt die lange Beschriftung, .sm die kurze */
  .sm{ display:none; }

  /* Kopf: oben der Titel, darunter die Schalter links und der Punktestand rechts */
  .top{ display:flex; flex-direction:column; gap:14px; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand svg{ width:44px; height:44px; flex:none; }
  .brand h1{ font-family:var(--f-display); font-weight:800; font-size:clamp(1.55rem, 4.4vw, 2.05rem); line-height:1.05; letter-spacing:-.015em; margin:0; }
  .brand p{ margin:2px 0 0; color:var(--ink-soft); font-size:.9rem; }
  .top-r{ display:flex; align-items:center; justify-content:space-between; gap:10px 16px; flex-wrap:wrap; }
  .prefs{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill{ display:inline-flex; align-items:center; gap:8px; min-height:36px; padding:6px 12px; border:1.5px solid var(--line); border-radius:999px; background:var(--surface); color:var(--ink-soft); font:inherit; font-size:.85rem; font-weight:700; cursor:pointer; }
  .pill[aria-pressed="true"]{ border-color:var(--pen); color:var(--pen); background:var(--pen-soft); }
  @media (hover: hover){ .pill:hover{ border-color:var(--pen); color:var(--pen); } }
  .pill .ico{ width:16px; height:16px; flex:none; fill:currentColor; }
  .sw{ display:inline-flex; width:22px; height:12px; border-radius:2px; overflow:hidden; }
  .sw i{ flex:1; }
  .sw i:first-child{ background:var(--north); }
  .sw i:last-child{ background:var(--south); }
  .score{ display:flex; align-items:baseline; gap:6px; font-variant-numeric:tabular-nums; }
  .score b{ font-family:var(--f-display); font-weight:800; font-size:1.7rem; color:var(--pen); line-height:1; }
  .score span{ color:var(--ink-soft); font-size:.9rem; }

  /* Fragenleiste: eine Nummer pro Frage, gruppiert nach Versuch */
  .nav{ display:flex; flex-wrap:wrap; gap:10px 18px; }
  .grp{ display:flex; flex-direction:column; gap:5px; }
  .grp-lbl{ font-size:.72rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-soft); white-space:nowrap; }
  .grp.cur .grp-lbl{ color:var(--pen); }
  .chips{ display:flex; gap:4px; }
  .qchip{ min-width:32px; height:32px; padding:0 6px; border-radius:8px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink-soft); font:inherit; font-size:.85rem; font-weight:700; font-variant-numeric:tabular-nums; cursor:pointer; transition:border-color .15s, background-color .15s; }
  @media (hover: hover){ .qchip:hover{ border-color:var(--pen); color:var(--pen); } }
  .qchip.ok{ background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
  .qchip.part{ background:var(--part-bg); border-color:var(--part); color:var(--part); }
  .qchip.bad{ background:var(--bad-bg); border-color:var(--bad); color:var(--bad); }
  .qchip.cur{ background:var(--pen); border-color:var(--pen); color:var(--on-pen); box-shadow:0 0 0 3px var(--pen-soft); }
  .qchip.end{ padding:0 12px; }
  .mk{ display:none; font-style:normal; margin-left:2px; font-size:.8em; }
  :root[data-cb="on"] .mk{ display:inline; }

  /* Blatt */
  .sheet{ --pad:clamp(18px, 4.5vw, 34px); background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:var(--pad); display:flex; flex-direction:column; gap:20px; }
  .eyebrow{ display:flex; justify-content:space-between; gap:6px 14px; flex-wrap:wrap; font-size:.76rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .eyebrow .st{ color:var(--pen); }
  .art{ display:block; width:100%; max-width:340px; height:auto; }
  .art.wide{ max-width:480px; }
  .qhead{ display:flex; flex-direction:column; gap:6px; }
  .prompt{ margin:0; font-weight:700; font-size:clamp(1.15rem, 2.9vw, 1.36rem); line-height:1.35; text-wrap:balance; max-width:60ch; }
  .sub{ margin:0; color:var(--ink-soft); font-size:.95rem; max-width:62ch; }

  /* Artwork */
  .m-n{ fill:var(--north); } .m-s{ fill:var(--south); }
  .m-t{ fill:#fff; font:800 13px var(--f-display); text-anchor:middle; dominant-baseline:central; }
  .steel, .bare{ fill:var(--steel); }
  .clip{ fill:none; stroke:var(--steel); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .arr line{ stroke:var(--ink-soft); stroke-width:2; }
  .arr path{ fill:var(--ink-soft); }
  .arr.dashed line{ stroke:var(--pen); stroke-dasharray:5 4; }
  .arr.dashed path{ fill:var(--pen); }
  .dim line{ stroke:var(--pen); stroke-width:1.5; }
  .dim text{ fill:var(--pen); font:italic 700 15px var(--f-body); text-anchor:middle; }
  .ruler rect{ fill:var(--ruler); stroke:var(--ruler-line); stroke-width:1; }
  .ruler line{ stroke:var(--ruler-line); stroke-width:1; }
  .ruler text{ fill:var(--ruler-line); font:700 8.5px var(--f-body); text-anchor:middle; }
  .skewer{ stroke:var(--wood); stroke-width:3.5; stroke-linecap:round; }
  .kgrid line{ stroke:var(--kgrid); stroke-width:1; }
  .coin5{ fill:var(--copper); } .coin10{ fill:var(--gold); }
  .coin-t{ font:800 8.5px var(--f-display); text-anchor:middle; dominant-baseline:central; }
  .coin5 + .coin-t{ fill:#fff; } .coin10 + .coin-t{ fill:#3F3105; }
  .foil{ fill:var(--alu); stroke:var(--alu-line); stroke-width:1; stroke-linejoin:round; }
  .wire{ fill:none; stroke:var(--copper); stroke-width:2.4; stroke-linecap:round; }
  .hand{ fill:var(--pen); font:700 22px var(--f-hand); text-anchor:middle; }
  .lbl{ fill:var(--ink-soft); font:700 8px var(--f-body); text-anchor:middle; }
  .cap{ fill:var(--ink-soft); font:700 10px var(--f-body); text-anchor:middle; letter-spacing:.04em; }

  /* Multiple Choice */
  .opts{ display:flex; flex-direction:column; gap:10px; }
  .opt{ display:grid; grid-template-columns:30px minmax(0,1fr) 22px; align-items:center; gap:12px; width:100%; text-align:left; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); font:inherit; line-height:1.4; cursor:pointer; transition:border-color .15s, background-color .15s; }
  @media (hover: hover){ .opt:hover:not(:disabled){ border-color:var(--pen); } }
  .opt[aria-pressed="true"]{ border-color:var(--pen); background:var(--pen-soft); }
  .opt-key{ width:30px; height:30px; border-radius:8px; display:grid; place-items:center; font-weight:700; font-size:.85rem; background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line); }
  .opt[aria-pressed="true"] .opt-key{ background:var(--pen); color:var(--on-pen); border-color:var(--pen); }
  .opt-ico{ font-weight:700; font-size:1.1rem; text-align:center; }
  .opt.is-ok{ border-color:var(--ok); background:var(--ok-bg); }
  .opt.is-ok .opt-key{ background:var(--ok); color:var(--surface); border-color:var(--ok); }
  .opt.is-ok .opt-ico{ color:var(--ok); }
  .opt.is-bad{ border-color:var(--bad); background:var(--bad-bg); }
  .opt.is-bad .opt-key{ background:var(--bad); color:var(--surface); border-color:var(--bad); }
  .opt.is-bad .opt-ico{ color:var(--bad); }
  .opt.is-miss{ border-color:var(--ok); border-style:dashed; }
  .opt.is-miss .opt-ico{ color:var(--ok); }
  .opt.is-dim{ opacity:.5; }
  .opts.multi .opt-key{ border-radius:6px; border:1.5px solid var(--ink-soft); background:var(--surface); font-size:1.05rem; }
  .opts.multi .opt[aria-pressed="true"] .opt-key{ background:var(--pen); color:var(--on-pen); border-color:var(--pen); }
  .opts.multi .opt.is-ok .opt-key{ background:var(--ok); color:var(--surface); border-color:var(--ok); }
  .opts.multi .opt.is-bad .opt-key{ background:var(--bad); color:var(--surface); border-color:var(--bad); }
  .opt:disabled{ cursor:default; }

  /* Ankreuz-Tabelle */
  .mx-wrap, .tbl-wrap{ overflow-x:auto; }
  .mx{ width:100%; border-collapse:collapse; }
  .mx th, .mx td{ padding:7px 6px; border-bottom:1px solid var(--line); }
  .mx thead th{ font-size:.74rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-soft); text-align:center; vertical-align:bottom; }
  .mx thead th:first-child{ text-align:left; }
  .mx tbody th{ text-align:left; font-weight:400; }
  .mx td{ text-align:center; width:88px; }
  .mx td.res, .mx th.res{ width:26px; padding-inline:0; font-weight:700; font-size:1.1rem; }
  .box{ width:42px; height:42px; padding:0; border:1.5px solid var(--ink-soft); border-radius:6px; background:var(--surface); display:inline-grid; place-items:center; font-family:var(--f-hand); font-weight:700; font-size:2.1rem; line-height:1; color:var(--pen); cursor:pointer; transition:background-color .15s, border-color .15s; }
  @media (hover: hover){ .box:hover:not(:disabled){ border-color:var(--pen); background:var(--pen-soft); } }
  .box:disabled{ cursor:default; }
  .mx tr.is-ok .box.sel{ color:var(--ok); border-color:var(--ok); }
  .mx tr.is-bad .box.sel{ color:var(--bad); border-color:var(--bad); }
  .box.should{ border-color:var(--ok); border-style:dashed; background:var(--ok-bg); }
  .mx tr.is-ok td.res{ color:var(--ok); }
  .mx tr.is-bad td.res{ color:var(--bad); }

  /* Zahleneingabe */
  .data{ border-collapse:collapse; min-width:260px; }
  .data th, .data td{ border:1px solid var(--line); padding:6px 14px; text-align:left; }
  .data thead th{ font-size:.74rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-soft); background:var(--surface-2); }
  .data td.val{ text-align:center; font-family:var(--f-hand); font-weight:700; font-size:1.5rem; line-height:1.1; color:var(--pen); font-variant-numeric:tabular-nums; }
  .data tr.mean > *{ border-top:2px solid var(--ink-soft); }
  .data input{ -webkit-appearance:none; appearance:none; width:3.4em; font:inherit; color:inherit; text-align:center; background:var(--pen-soft); border:0; border-bottom:2px solid var(--pen); border-radius:4px 4px 0 0; padding:4px 6px; }
  /* Safari graut gesperrte Eingabefelder sonst aus, dann wäre grün/rot nach dem Prüfen kaum zu sehen */
  .data input:disabled{ opacity:1; -webkit-text-fill-color:currentColor; }
  .data tr.mean.is-ok input{ color:var(--ok); background:var(--ok-bg); border-bottom-color:var(--ok); }
  .data tr.mean.is-bad input{ color:var(--bad); background:var(--bad-bg); border-bottom-color:var(--bad); text-decoration:line-through; }
  .num-fix{ margin:0; color:var(--ok); font-weight:700; }

  /* Rückmeldung */
  .fb{ display:flex; flex-direction:column; gap:4px; padding:14px 16px; border-radius:12px; border:1px solid transparent; animation:rise .22s ease-out; }
  .fb p{ margin:0; max-width:64ch; }
  .fb-head{ font-family:var(--f-display); font-weight:800; font-size:1.12rem; }
  .fb.ok{ background:var(--ok-bg); }
  .fb.ok .fb-head{ color:var(--ok); }
  .fb.bad{ background:var(--bad-bg); }
  .fb.bad .fb-head{ color:var(--bad); }
  .fb.part{ background:var(--part-bg); }
  .fb.part .fb-head{ color:var(--part); }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }

  .actions{ display:flex; flex-direction:column; gap:10px; padding-top:16px; border-top:1px solid var(--line); }
  /* Bei den Fragen bleibt die Leiste mit Prüfen/Weiter am unteren Bildschirmrand stehen, auf dem Handy muss man dafür nicht scrollen */
  .actions.dock{ position:-webkit-sticky; position:sticky; bottom:0; z-index:1; margin-inline:calc(-1 * var(--pad)); padding:14px var(--pad) calc(14px + env(safe-area-inset-bottom, 0px)); background:var(--surface); }
  .ico-arr{ width:20px; height:20px; vertical-align:-4px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .btns{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .spacer{ flex:1; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.ghost{ padding-inline:16px; }
  .hint{ color:var(--ink-soft); font-size:.92rem; }
  .hint b{ color:var(--ok); }
  .btn{ font:inherit; font-weight:700; padding:12px 22px; border-radius:12px; border:1.5px solid transparent; cursor:pointer; }
  .btn.primary{ background:var(--pen); color:var(--on-pen); }
  .btn.primary:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.ghost{ background:transparent; border-color:var(--line); color:var(--ink); }
  @media (hover: hover){ .btn.ghost:hover:not(:disabled){ border-color:var(--pen); color:var(--pen); } }
  .open-note{ margin:0; color:var(--part); font-weight:700; }

  /* Auswertung */
  .res-top{ display:flex; flex-direction:column; gap:4px; }
  .res-score{ margin:0; font-family:var(--f-display); font-weight:600; font-size:1.3rem; line-height:1.1; font-variant-numeric:tabular-nums; }
  .res-score span{ font-weight:800; font-size:3.4rem; color:var(--pen); letter-spacing:-.02em; margin-right:4px; }
  .res-msg{ margin:4px 0 0; font-size:1.05rem; max-width:56ch; }
  .rs-list{ display:flex; flex-direction:column; gap:12px; }
  .rs{ display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 3.2em; align-items:center; gap:12px; }
  .rs-l{ display:flex; flex-direction:column; font-weight:700; line-height:1.25; }
  .rs-l small{ font-weight:400; color:var(--ink-soft); font-size:.85rem; }
  .rs-bar{ display:block; height:10px; border-radius:5px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden; }
  .rs-bar i{ display:block; height:100%; }
  .rs-v{ text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
  .sec-h{ margin:6px 0 0; font-family:var(--f-display); font-weight:800; font-size:1.15rem; }
  .miss{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .miss li{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; align-items:start; padding:12px 14px; border:1px solid var(--line); border-radius:10px; }
  .tag{ display:inline-block; padding:2px 8px; border-radius:6px; background:var(--pen-soft); color:var(--pen); font-size:.74rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; white-space:nowrap; }
  .miss p{ margin:0; }
  .miss-q{ font-weight:700; }
  .miss-a{ color:var(--ink-soft); font-size:.95rem; margin-top:2px !important; }
  .miss-a b{ color:var(--ok); }
  .perfect{ margin:0; font-weight:700; color:var(--ok); }

  /* Rückmeldung beim Antippen. iOS zeigt :active nur, weil das Skript auf touchstart hört. */
  .opt, .box, .qchip, .btn, .pill{ transition:border-color .15s, background-color .15s, transform .1s; }
  .opt:active:not(:disabled), .box:active:not(:disabled), .btn:active:not(:disabled), .qchip:active, .pill:active{ transform:scale(.97); }

  @media (max-width:560px){
    .lg{ display:none; }
    .sm{ display:inline; }
    .wrap{ padding-block:16px 28px; gap:16px; }
    .brand svg{ width:38px; height:38px; }
    .score b{ font-size:1.45rem; }
    .score span{ font-size:.82rem; }
    /* Dunkelmodus nur als Mond-Symbol, die Beschriftung bleibt für Screenreader erhalten */
    #theme{ padding-inline:11px; }
    #theme .t-lbl{ position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
    .nav{ gap:10px 14px; }
    .spacer{ display:none; }
    /* Fragen: Zurück (nur Pfeil), Überspringen und Prüfen in einer Zeile, Prüfen am größten und rechts beim Daumen */
    .actions.dock{ gap:8px; padding-block:10px calc(10px + env(safe-area-inset-bottom, 0px)); }
    .dock .hint{ font-size:.86rem; line-height:1.3; }
    .dock .btns{ gap:8px; }
    .dock .btn{ flex:0 0 auto; padding-inline:14px; }
    .dock .btn.primary{ flex:1 1 auto; }
    /* Auswertung: Neustart oben über die ganze Breite, darunter die übrigen Knöpfe */
    .res-actions .btn{ flex:1 1 0; }
    .res-actions .btn.primary{ flex-basis:100%; order:-1; }
    .mx th, .mx td{ padding-inline:4px; }
    .mx td{ width:56px; }
    .box{ width:40px; height:40px; font-size:1.9rem; }
    .rs{ grid-template-columns:minmax(0,1fr) 3.2em; }
    .rs-bar{ grid-column:1 / -1; grid-row:2; }
  }
  /* Finger statt Maus: größere Tippflächen */
  @media (pointer: coarse){
    .pill{ min-height:40px; }
    .qchip{ min-width:40px; height:40px; }
    .box{ width:44px; height:44px; }
    .data input{ min-height:44px; }
  }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation:none !important; transition:none !important; }
  }
</style>

<div class="wrap">

    <div class="brand">
      <svg viewBox="0 0 44 44" aria-hidden="true">
        <g transform="rotate(-28 22 22)">
          <rect x="4" y="15" width="18" height="14" class="m-n"/>
          <rect x="22" y="15" width="18" height="14" class="m-s"/>
          <text x="13" y="22.5" class="m-t" style="font-size:10px">N</text>

        <button type="button" class="pill" id="theme" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><span class="t-lbl">Dunkelmodus</span></button>

<script>
(() => {
  const VERSION = 5;

  const STATIONS = [
    { id: 1, label: 'Versuch 1', short: 'V1', title: 'Welche Stoffe sind magnetisch?', art: 'v1' },
    { id: 2, label: 'Versuch 2', short: 'V2', title: 'Anziehung und Abstoßung der Pole', art: 'v2' },
    { id: 3, label: 'Versuch 3', short: 'V3', title: 'Reichweite von Magneten', art: 'v3' },
    { id: 4, label: 'Versuch 4', short: 'V4', title: 'Abstoßung von Magneten', art: 'v4' },
    { id: 5, label: 'Versuch 5', short: 'V5', title: 'Einen Nagel magnetisieren', art: 'v5' },
  ];

  // Bei Multiple Choice steht die richtige Antwort vorn, weil die Reihenfolge beim Start gemischt wird.
  const QUESTIONS = [
    { st: 1, type: 'matrix',
      q: 'Du hältst den Stabmagneten an diese Gegenstände. Welche werden angezogen?',
      sub: 'Kreuze in jeder Zeile an, so wie du es auf dem Arbeitsblatt gemacht hast.',
      rowHead: 'Gegenstand', cols: ['ja', 'nein'],
      rows: [['Eisennagel', 0], ['Aluminiumfolie', 1], ['Kupferdraht', 1], ['5-Cent-Münze', 0], ['10/20/50-Cent-Münze', 1]],
      explain: 'Der Nagel besteht aus Eisen. Spannend sind die Münzen: Die <b>5-Cent-Münze</b> hat einen Kern aus Eisen, der nur mit Kupfer überzogen ist. Die <b>10-, 20- und 50-Cent-Münzen</b> bestehen dagegen aus einer Mischung aus Kupfer, Aluminium, Zink und Zinn, die nicht angezogen wird. Aluminium und Kupfer sind zwar Metalle, werden aber nicht angezogen. Gegenstände aus Holz oder Kunststoff wie Holzspieß und Geodreieck werden sowieso nicht angezogen.' },
    { st: 1, type: 'mc',
      q: 'Tim sagt: „Ein Magnet zieht alle Metalle an.“ Hat er recht?',
      opts: ['Nein, weil auch Aluminium und Kupfer Metalle sind, die nicht angezogen werden.', 'Ja, weil alles angezogen wird, was aus Metall ist.', 'Ja, aber nur, wenn das Metall glänzt.', 'Nein, weil Magnete überhaupt keine Metalle anziehen.'],
      explain: 'Ein Magnet zieht nur Gegenstände aus <b>Eisen, Nickel oder Cobalt</b> an. Viele andere Metalle wie Aluminium, Kupfer, Gold oder Silber bleiben einfach liegen.' },
    { st: 1, type: 'mc',
      q: 'Stoffe wie Eisen, Nickel und Cobalt nennt man magnetisierbar. Welcher Fachbegriff wird dafür auch verwendet?',
      opts: ['ferromagnetisch', 'elektromagnetisch', 'metallisch', 'magnetisiert'],
      explain: '„Ferrum“ ist das lateinische Wort für Eisen, sodass <b>ferromagnetisch</b> so viel heißt wie „magnetisch wie Eisen“. Magnetisiert ist dagegen ein Gegenstand, der selbst zum Magneten gemacht wurde, wie der Nagel in Versuch 5.' },

    { st: 2, type: 'matrix',
      q: 'Du näherst dem Magneten auf den Holzspießen einen zweiten Magneten. Was passiert?',
      sub: 'Kreuze für jedes Polpaar an.',
      rowHead: 'Gegenüberliegende Pole', cols: ['ziehen an', 'stoßen ab'],
      rows: [['Nordpol und Nordpol', 1], ['Nordpol und Südpol', 0], ['Südpol und Südpol', 1]],
      explain: '<b>Gleiche Pole stoßen sich ab, ungleiche Pole ziehen sich an.</b> Nord und Nord oder Süd und Süd schieben sich weg, Nord und Süd schnappen zusammen.' },
    { st: 2, type: 'mc', art: 'unknown',
      q: 'Bei einem Magneten ist die Farbe abgeblättert. Als du ein Ende an den Nordpol eines anderen Magneten hältst, wird es abgestoßen. Welcher Pol ist das?',
      opts: ['Ein Nordpol', 'Ein Südpol', 'Das kann man so nicht herausfinden.', 'Ein Pluspol'],
      explain: 'Weil sich nur gleiche Pole abstoßen, ist das unbekannte Ende ein <b>Nordpol</b>. Pluspol und Minuspol gibt es bei Batterien, nicht bei Magneten. Anziehung wäre übrigens kein sicherer Beweis, weil ein Stück Eisen von beiden Polen angezogen wird.' },

    { st: 3, type: 'mc',
      q: 'Die Büroklammer setzt sich in Bewegung, obwohl der Magnet sie noch gar nicht berührt. Was zeigt das?',
      opts: ['Ein Magnet wirkt auch über einen Abstand, ohne dass er etwas berühren muss.', 'Jemand hat an den Tisch gestoßen.', 'Der Magnet erzeugt einen Luftzug, der die Klammer schiebt.', 'Das Lineal ist selbst ein Magnet.'],
      explain: 'Um jeden Magneten herum gibt es einen Bereich, in dem er wirkt: das <b>Magnetfeld</b>. Je näher die Büroklammer dem Magneten kommt, desto stärker wird sie angezogen.' },
    { st: 3, type: 'number',
      q: 'Eine Gruppe hat diese Werte gemessen. Berechne den Mittelwert und trage ihn in die Tabelle ein.',
      sub: 'Den Mittelwert berechnest du, indem du alle Werte addierst und durch die Anzahl der Messungen teilst.',
      table: [['Messung 1', '3,5'], ['Messung 2', '4,0'], ['Messung 3', '3,9']],
      answer: 3.8, unit: 'cm',
      explain: '(3,5 + 4,0 + 3,9) : 3 = 11,4 : 3 = <b>3,8 cm</b>. Die Reichweite dieses Magneten beträgt also etwa 3,8 cm.' },

    { st: 4, type: 'mc',
      q: 'Lenas Gruppe hat in Versuch 4 dreimal gemessen. Warum ist es sinnvoll, mehrmals zu messen?',
      table: [['Messung 1', '7,5'], ['Messung 2', '3,0'], ['Messung 3', '3,2']],
      opts: ['Weil eine einzelne Messung ein Ausreißer sein kann, den man erst durch weitere Messungen bemerkt.', 'Weil die erste Messung immer die genaueste ist.', 'Weil der Magnet mit jeder Messung schwächer wird.', 'Damit man sich den größten Wert aussuchen kann.'],
      explain: 'Beim Messen passieren leicht Fehler, zum Beispiel wenn man zu schnell schiebt oder schräg auf das Lineal schaut. Wenn man nur einmal misst, merkt man das nicht. Misst man mehrmals, fällt ein <b>Ausreißer</b> wie die 7,5 cm sofort auf, weil die anderen Werte viel näher beieinanderliegen.' },
    { st: 4, type: 'mc',
      q: 'Gruppe A misst d = 3 cm. Gruppe B macht denselben Versuch mit zwei stärkeren Magneten. Was erwartest du bei Gruppe B?',
      opts: ['Einen größeren Abstand d', 'Einen kleineren Abstand d', 'Genau denselben Abstand d', 'Die Magnete ziehen sich jetzt an.'],
      explain: 'Weil stärkere Magnete weiter wirken, beginnt der Magnet auf den Holzspießen schon <b>früher</b> zu rollen, sodass der Abstand d größer wird.' },

    { st: 5, type: 'mc',
      q: 'Wie musst du über den Nagel streichen, damit er selbst zum Magneten wird?',
      opts: ['20-mal mit demselben Pol, immer in dieselbe Richtung', '20-mal hin und her, wie beim Radieren', 'Abwechselnd mit dem Nord- und dem Südpol', 'Einmal ganz fest mit der Mitte des Magneten'],
      explain: 'Nur wenn du immer mit <b>demselben Pol in dieselbe Richtung</b> streichst, wird der Nagel magnetisiert. Hin und her oder mit wechselnden Polen hebt sich die Wirkung wieder auf.' },
    { st: 5, type: 'matrix',
      q: 'Hält der Nagel in Versuch 5 eine Büroklammer?',
      sub: 'Kreuze an, was bei diesem Versuch zu erwarten ist.',
      rowHead: 'Nagel', cols: ['ja', 'nein'],
      rows: [['vor dem Bestreichen', 1], ['nach dem Bestreichen', 0], ['nach dem Fallenlassen', 1]],
      explain: 'Vorher ist der Nagel kein Magnet und hält <b>keine</b> Büroklammer. Nach dem Bestreichen ist er selbst zum Magneten geworden und hält sie. Nach dem Fallenlassen ist er wieder <b>entmagnetisiert</b>, sodass die Büroklammer abfällt. Falls euer Nagel sie danach noch gehalten hat, ist er durch das Fallenlassen nur schwächer geworden.' },
  ];

  QUESTIONS.forEach(q => { if (q.type === 'mc' && q.a == null) q.a = 0; });

  /* ---------- Zeichnungen ---------- */
  const svg = (w, h, inner, label, cls = 'art') => `<svg class="${cls}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">${inner}</svg>`;
  const pole = p => p === 'N' ? 'm-n' : 'm-s';
  const magnet = (x, y, w, h, l, r) => {
    const hw = w / 2;
    return `<rect x="${x}" y="${y}" width="${hw}" height="${h}" class="${pole(l)}"/><rect x="${x + hw}" y="${y}" width="${hw}" height="${h}" class="${pole(r)}"/>` +
      `<text x="${x + hw / 2}" y="${y + h / 2}" class="m-t">${l}</text><text x="${x + hw * 1.5}" y="${y + h / 2}" class="m-t">${r}</text>`;
  };
  const vmagnet = (x, y, w, h, top, bottom) => {
    const hh = h / 2;
    return `<rect x="${x}" y="${y}" width="${w}" height="${hh}" class="${pole(top)}"/><rect x="${x}" y="${y + hh}" width="${w}" height="${hh}" class="${pole(bottom)}"/>` +
      `<text x="${x + w / 2}" y="${y + hh / 2}" class="m-t">${top}</text><text x="${x + w / 2}" y="${y + hh * 1.5}" class="m-t">${bottom}</text>`;
  };
  const clip = (x, y) => `<path class="clip" d="M${x + 10} ${y + 10}H${x + 32}a4 4 0 0 0 0-8H${x + 6}a6 6 0 0 0 0 12H${x + 36}"/>`;
  const nail = (x, y, len) => `<g class="steel"><rect x="${x}" y="${y - 5}" width="5" height="18" rx="1.5"/><rect x="${x + 5}" y="${y}" width="${len}" height="8"/><path d="M${x + 5 + len} ${y}L${x + 19 + len} ${y + 4}L${x + 5 + len} ${y + 8}Z"/></g>`;
  const arrow = (x1, y, x2, cls = 'arr') => {
    const d = Math.sign(x2 - x1);
    return `<g class="${cls}"><line x1="${x1}" y1="${y}" x2="${x2 - d * 5}" y2="${y}"/><path d="M${x2} ${y}L${x2 - d * 9} ${y - 4.5}L${x2 - d * 9} ${y + 4.5}Z"/></g>`;
  };
  const dim = (x1, x2, y, t) => `<g class="dim"><line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/><line x1="${x1}" y1="${y - 6}" x2="${x1}" y2="${y + 6}"/><line x1="${x2}" y1="${y - 6}" x2="${x2}" y2="${y + 6}"/><text x="${(x1 + x2) / 2}" y="${y - 7}">${t}</text></g>`;
  const skewers = (xs, y1, y2) => xs.map(x => `<line class="skewer" x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/>`).join('');
  const kgrid = (w, h, step, ox, oy) => {
    let l = '';
    for (let x = ox; x <= w; x += step) l += `<line x1="${x}" y1="0" x2="${x}" y2="${h}"/>`;
    for (let y = oy; y <= h; y += step) l += `<line x1="0" y1="${y}" x2="${w}" y2="${y}"/>`;
    return `<g class="kgrid">${l}</g>`;
  };
  const ruler = (x, y, w, h, n, step, x0) => {
    let t = '';
    for (let i = 0; i <= n; i++) {
      const tx = x0 + i * step;
      t += `<line x1="${tx}" y1="${y}" x2="${tx}" y2="${y + 8}"/><text x="${tx}" y="${y + h - 4}">${i}</text>`;
      if (i < n) t += `<line x1="${tx + step / 2}" y1="${y}" x2="${tx + step / 2}" y2="${y + 4}"/>`;
    }
    return `<g class="ruler"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2"/>${t}</g>`;
  };
  const coin = (cx, cy, r, cls, label) => `<circle class="${cls}" cx="${cx}" cy="${cy}" r="${r}"/><text class="coin-t" x="${cx}" y="${cy}">${label}</text>`;
  const foil = (cx, cy) => {
    const pts = [[-13, -6], [-6, -10], [2, -7], [9, -11], [13, -3], [10, 5], [13, 10], [2, 8], [-5, 11], [-12, 6], [-9, 0]];
    return `<polygon class="foil" points="${pts.map(([x, y]) => `${cx + x},${cy + y}`).join(' ')}"/>`;
  };
  const wire = (x, y) => `<path class="wire" d="M${x} ${y}q4 -12 8 0t8 0t8 0t8 0"/>`;

  const ART = {
    // Draufsicht: Der Magnet wird nacheinander an die Gegenstände aus der Tabelle gehalten.
    v1: () => svg(360, 102,
      magnet(12, 10, 96, 24, 'N', 'S') + arrow(118, 22, 348, 'arr dashed') +
      nail(23, 68, 18) + foil(112, 72) + wire(164, 76) + coin(248, 72, 10, 'coin5', '5') + coin(316, 72, 11, 'coin10', '10') +
      [['Nagel', 44], ['Alufolie', 112], ['Kupfer', 180], ['5 ct', 248], ['10 ct', 316]]
        .map(([t, x]) => `<text class="lbl" x="${x}" y="98">${t}</text>`).join(''),
      'Ein Stabmagnet wird nacheinander an Nagel, Alufolie, Kupferdraht und Münzen gehalten', 'art wide'),
    // Draufsicht: Magnet auf Holzspießen, ein zweiter Magnet wird angenähert.
    v2: () => svg(340, 78,
      skewers([44, 78, 112], 16, 64) + magnet(22, 27, 112, 26, 'N', 'S') + `<text class="hand" x="170" y="47">?</text>` + magnet(206, 27, 112, 26, 'N', 'S'),
      'Ein Magnet liegt auf drei Holzspießen, ein zweiter Magnet wird angenähert'),
    // Frage zum unbekannten Pol: linker Magnet ohne Farbe und Beschriftung, wird vom Nordpol weggeschoben.
    unknown: () => svg(340, 78,
      arrow(34, 40, 8) + `<rect class="bare" x="40" y="27" width="112" height="26"/>` + magnet(206, 27, 112, 26, 'N', 'S'),
      'Ein Magnet ohne Farbe und Beschriftung wird vom Nordpol eines zweiten Magneten abgestoßen'),
    // Draufsicht auf Karopapier: Büroklammer und Magnet liegen auf einer Karolinie am Lineal.
    v3: () => svg(340, 88,
      kgrid(340, 88, 12, 8, 8) + dim(56, 196, 20, 'd') + clip(20, 37) + magnet(196, 32, 104, 24, 'N', 'S') + arrow(334, 44, 308) + ruler(50, 58, 284, 22, 11, 24, 56),
      'Auf Karopapier wird ein Magnet am Lineal auf eine Büroklammer zugeschoben, Abstand d'),
    // Draufsicht auf Karopapier: Magnet auf Holzspießen, Nullpunkt des Lineals an seinem Ende, zweiter Magnet mit gleichem Pol voran.
    v4: () => svg(340, 92,
      kgrid(340, 92, 12, 12, 7) + skewers([36, 68, 100], 20, 64) + magnet(16, 30, 104, 26, 'N', 'S') +
      dim(120, 212, 18, 'd') + magnet(212, 30, 104, 26, 'S', 'N') + arrow(318, 18, 262) + ruler(114, 68, 220, 20, 8, 24, 120),
      'Ein Magnet liegt auf Holzspießen, ein zweiter wird mit dem gleichen Pol voran herangeschoben, Abstand d'),
    v5: () => svg(340, 80,
      vmagnet(70, 4, 22, 54, 'S', 'N') + arrow(104, 46, 286, 'arr dashed') + `<text class="hand" x="196" y="38">20 ×</text>` + nail(24, 58, 262),
      'Ein Magnet streicht 20-mal in dieselbe Richtung über einen Eisennagel'),
  };

  /* ---------- Zustand ---------- */
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const initResp = q => q.type === 'multi' ? [] : q.type === 'matrix' ? q.rows.map(() => null) : q.type === 'number' ? '' : null;
  const allIdx = () => QUESTIONS.map((_, i) => i);

  function freshState(queue, mode) {
    const s = { v: VERSION, queue, mode, pos: 0, resp: {}, res: {}, order: {}, done: false };
    queue.forEach(i => {
      const q = QUESTIONS[i];
      s.resp[i] = initResp(q);
      if (q.type === 'mc' || q.type === 'multi') s.order[i] = shuffle(q.opts.map((_, k) => k));
    });
    return s;
  }
  const validState = s => s && s.v === VERSION && Array.isArray(s.queue) && s.queue.length > 0 &&
    s.queue.every(i => Number.isInteger(i) && i >= 0 && i < QUESTIONS.length) &&
    Number.isInteger(s.pos) && s.pos >= 0 && s.pos < s.queue.length && s.resp && s.res && s.order;

  let S;

  /* ---------- Bewertung ---------- */
  const maxPts = q => q.type === 'matrix' ? q.rows.length : 1;
  const parseNum = v => {
    const n = parseFloat(String(v || '').replace(',', '.').replace(/[^\d.\-]/g, ''));
    return Number.isFinite(n) ? n : null;
  };
  const fmtNum = n => String(n).replace('.', ',');

  function complete(q, r) {
    if (q.type === 'mc') return r != null;
    if (q.type === 'multi') return r.length > 0;
    if (q.type === 'matrix') return r.every(v => v != null);
    if (q.type === 'number') return parseNum(r) != null;
    return false;
  }

  function grade(q, r) {
    if (q.type === 'mc') return { score: r === q.a ? 1 : 0 };
    if (q.type === 'multi') {
      // Ein Punkt nur, wenn genau die richtigen Antworten angehakt sind
      const hits = r.filter(k => q.a.includes(k)).length;
      return { score: hits === q.a.length && r.length === q.a.length ? 1 : 0, partial: hits > 0 };
    }
    if (q.type === 'number') return { score: Math.abs(parseNum(r) - q.answer) < 0.05 ? 1 : 0 };
    const ok = q.rows.map(([, a], i) => r[i] === a);
    return { score: ok.filter(Boolean).length, ok };
  }

  function totals() {
    let pts = 0, max = 0;
    S.queue.forEach(i => { max += maxPts(QUESTIONS[i]); if (S.res[i]) pts += S.res[i].score; });
    return { pts, max };
  }

  /* ---------- Darstellung ---------- */
  const $ = (sel, root = document) => root.querySelector(sel);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const sheet = $('#sheet'), track = $('#track');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let pendingFocus = null;

  // Farbenblind-Modus: pro Gerät gemerkt, damit er beim nächsten Öffnen noch an ist
  const cbBtn = $('#cb');
  function setCB(on) {
    document.documentElement.dataset.cb = on ? 'on' : 'off';
    cbBtn.setAttribute('aria-pressed', String(on));
    try { localStorage.setItem('magnetQuiz.cb', on ? '1' : '0'); } catch (e) { /* Speicher gesperrt */ }
  }
  let cbStored = false;
  try { cbStored = localStorage.getItem('magnetQuiz.cb') === '1'; } catch (e) { /* Speicher gesperrt */ }
  setCB(cbStored);
  cbBtn.addEventListener('click', () => setCB(cbBtn.getAttribute('aria-pressed') !== 'true'));

  // Dunkelmodus: folgt zuerst dem Gerät bzw. der Umgebung. Eine eigene Wahl wird pro Gerät gemerkt und steht
  // in data-mode, damit sie nicht mit dem data-theme kollidiert, das die Umgebung setzen kann.
  const root = document.documentElement, themeBtn = $('#theme');
  const darkMQ = window.matchMedia('(prefers-color-scheme: dark)');
  const isDark = () => root.dataset.mode ? root.dataset.mode === 'dark'
    : root.dataset.theme ? root.dataset.theme === 'dark' : darkMQ.matches;
  const syncTheme = () => themeBtn.setAttribute('aria-pressed', String(isDark()));
  themeBtn.addEventListener('click', () => {
    root.dataset.mode = isDark() ? 'light' : 'dark';
    try { localStorage.setItem('magnetQuiz.mode', root.dataset.mode); } catch (e) { /* Speicher gesperrt */ }
    syncTheme();
  });
  if (darkMQ.addEventListener) darkMQ.addEventListener('change', syncTheme); else darkMQ.addListener(syncTheme);
  new MutationObserver(syncTheme).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  syncTheme();

  // Ohne einen touchstart-Listener zeigt Safari auf iPhone/iPad keine :active-Rückmeldung beim Antippen
  document.addEventListener('touchstart', () => {}, { passive: true });

  const STATE_WORD = { ok: 'richtig', part: 'teilweise richtig', bad: 'falsch' };
  const STATE_MARK = { ok: '✓', part: '~', bad: '✗' };
  function resState(qi) {
    const r = S.res[qi];
    if (!r) return '';
    return r.score === maxPts(QUESTIONS[qi]) ? 'ok' : r.score > 0 || r.partial ? 'part' : 'bad';
  }

  function renderChrome() {
    const cur = S.done ? null : QUESTIONS[S.queue[S.pos]].st;
    track.innerHTML = STATIONS.map(st => {
      const items = S.queue.map((qi, pos) => ({ qi, pos })).filter(o => QUESTIONS[o.qi].st === st.id);
      if (!items.length) return '';
      const chips = items.map(({ qi, pos }) => {
        const state = resState(qi), isCur = !S.done && pos === S.pos;
        return `<button type="button" class="qchip${state ? ' ' + state : ''}${isCur ? ' cur' : ''}" data-go="${pos}" data-fk="go${pos}"
          aria-label="Frage ${pos + 1}${state ? ', ' + STATE_WORD[state] : ', offen'}"${isCur ? ' aria-current="step"' : ''}>${pos + 1}${state ? `<i class="mk" aria-hidden="true">${STATE_MARK[state]}</i>` : ''}</button>`;
      }).join('');
      return `<div class="grp${st.id === cur ? ' cur' : ''}"><span class="grp-lbl" title="${st.title}"><span class="lg">${st.label}</span><span class="sm">${st.short}</span></span><div class="chips">${chips}</div></div>`;
    }).join('') +
      `<div class="grp"><span class="grp-lbl" aria-hidden="true">&nbsp;</span><div class="chips"><button type="button" class="qchip end${S.done ? ' cur' : ''}" data-go="end" data-fk="goend">Auswertung</button></div></div>`;
    const { pts, max } = totals();
    $('#score').innerHTML = `<b>${pts}</b><span>von ${max} Punkten</span>`;
    $('#mode').textContent = S.mode === 'retry' ? 'Übungsrunde: nur deine Fehler' : 'Quiz zu den Versuchen 1–5';
  }

  function mcHTML(q, qi, res) {
    const multi = q.type === 'multi';
    const isSel = k => multi ? S.resp[qi].includes(k) : S.resp[qi] === k;
    const isRight = k => multi ? q.a.includes(k) : k === q.a;
    const opts = S.order[qi].map((k, j) => {
      let cls = 'opt', ico = '';
      if (res) {
        if (isRight(k) && (isSel(k) || !multi)) { cls += ' is-ok'; ico = '✓'; }
        else if (isRight(k)) { cls += ' is-miss'; ico = '✓'; }
        else if (isSel(k)) { cls += ' is-bad'; ico = '✗'; }
        else cls += ' is-dim';
      }
      const key = multi ? (isSel(k) ? '✓' : '') : 'ABCD'[j];
      return `<button type="button" class="${cls}" data-opt="${k}" data-fk="opt${k}" aria-pressed="${isSel(k)}"${res ? ' disabled' : ''}>
        <span class="opt-key" aria-hidden="true">${key}</span><span>${q.opts[k]}</span><span class="opt-ico" aria-hidden="true">${ico}</span></button>`;
    }).join('');
    return `${q.table ? dataTable(q) : ''}<div class="opts${multi ? ' multi' : ''}" role="group" aria-label="Antworten">${opts}</div>`;
  }

  function matrixHTML(q, qi, res) {
    const r = S.resp[qi];
    const head = `<tr><th scope="col">${q.rowHead}</th>${q.cols.map(c => `<th scope="col">${c}</th>`).join('')}<th class="res"><span hidden>Ergebnis</span></th></tr>`;
    const body = q.rows.map(([label, ans], ri) => {
      const v = r[ri];
      let rowCls = '', mark = '';
      if (res) { const ok = v === ans; rowCls = ok ? 'is-ok' : 'is-bad'; mark = ok ? '✓' : '✗'; }
      const cells = q.cols.map((c, ci) => {
        let cls = 'box';
        if (v === ci) cls += ' sel';
        if (res && v !== ans && ci === ans) cls += ' should';
        return `<td><button type="button" class="${cls}" data-cell="${ri},${ci}" data-fk="c${ri}_${ci}" aria-pressed="${v === ci}" aria-label="${label}: ${c}"${res ? ' disabled' : ''}>${v === ci ? 'X' : ''}</button></td>`;
      }).join('');
      return `<tr class="${rowCls}"><th scope="row">${label.replace(/\//g, '/<wbr>')}</th>${cells}<td class="res" aria-label="${mark === '✓' ? 'richtig' : mark ? 'falsch' : ''}">${mark}</td></tr>`;
    }).join('');
    return `<div class="mx-wrap"><table class="mx"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
  }

  // Messtabelle wie auf dem Arbeitsblatt; bei Rechenaufgaben kommt die Zeile „Mittelwert“ mit Eingabefeld dazu.
  const dataTable = (q, extraRow = '') => `<div class="tbl-wrap"><table class="data">
    <thead><tr><th scope="col">Messung</th><th scope="col">Abstand d in cm</th></tr></thead>
    <tbody>${q.table.map(([a, b]) => `<tr><td>${a}</td><td class="val">${b}</td></tr>`).join('')}${extraRow}</tbody></table></div>`;

  function numberHTML(q, qi, res) {
    const state = res ? (res.score ? ' is-ok' : ' is-bad') : '';
    const row = `<tr class="mean${state}"><th scope="row"><label for="num">Mittelwert</label></th>
      <td class="val"><input id="num" data-fk="num" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" spellcheck="false" value="${esc(S.resp[qi] || '')}"${res ? ' disabled' : ''}></td></tr>`;
    const fix = res && !res.score ? `<p class="num-fix">Richtig wäre ${fmtNum(q.answer)} ${q.unit}.</p>` : '';
    return dataTable(q, row) + fix;
  }

  function feedbackHTML(q, res) {
    const max = maxPts(q);
    let cls, head;
    if (res.score === max) { cls = 'ok'; head = max > 1 ? 'Alles richtig!' : 'Richtig!'; }
    else if (res.partial) { cls = 'part'; head = 'Nicht ganz. Schau dir an, welche Antworten markiert sind.'; }
    else if (res.score === 0) { cls = 'bad'; head = max > 1 ? 'Leider alles falsch.' : 'Leider falsch.'; }
    else { cls = 'part'; head = `${res.score} von ${max} richtig`; }
    return `<div class="fb ${cls}" role="status"><strong class="fb-head">${head}</strong><p>${q.explain}</p></div>`;
  }

  const HINTS = { mc: 'Wähle eine Antwort.', multi: 'Hake alle passenden Antworten an.', matrix: 'Kreuze in jeder Zeile an.', number: 'Gib eine Zahl ein.' };

  function questionHTML() {
    const qi = S.queue[S.pos], q = QUESTIONS[qi], st = STATIONS[q.st - 1], res = S.res[qi];
    const eyebrow = `${st.label} · ${st.title}`;
    const body = q.type === 'matrix' ? matrixHTML(q, qi, res) : q.type === 'number' ? numberHTML(q, qi, res) : mcHTML(q, qi, res);
    const last = S.pos === S.queue.length - 1;
    const label = !res ? 'Prüfen' : last ? 'Auswertung ansehen' : 'Weiter';
    const disabled = !res && !complete(q, S.resp[qi]);
    const hint = res
      ? (res.score ? `<b>+${res.score} ${res.score === 1 ? 'Punkt' : 'Punkte'}</b>` : 'Kein Punkt. Lies die Erklärung, damit du es beim nächsten Mal weißt.')
      : HINTS[q.type];
    return `
      <div class="eyebrow"><span class="st">${eyebrow}</span><span>Frage ${S.pos + 1} von ${S.queue.length}</span></div>
      ${q.art || st.art ? ART[q.art || st.art]() : ''}
      <div class="qhead"><h2 class="prompt">${q.q}</h2>${q.sub ? `<p class="sub">${q.sub}</p>` : ''}</div>
      ${body}
      ${res ? feedbackHTML(q, res) : ''}
      <div class="actions dock"><span class="hint" id="hint">${hint}</span>
        <div class="btns">
          <button type="button" class="btn ghost" data-act="prev" data-fk="prev" aria-label="Zurück"${S.pos === 0 ? ' disabled' : ''}><span class="lg">Zurück</span><svg class="sm ico-arr" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4.5 6.5 10l5.5 5.5"/></svg></button>
          <span class="spacer"></span>
          ${res ? '' : `<button type="button" class="btn ghost" data-act="next" data-fk="next">Überspringen</button>`}
          <button type="button" class="btn primary" id="primary" data-fk="primary"${disabled ? ' disabled' : ''}>${label}</button>
        </div></div>`;
  }

  function answerText(q, res, r) {
    if (q.type === 'mc') return `Richtig: <b>${q.opts[q.a]}</b>`;
    if (q.type === 'multi') return `Richtig: <b>${q.a.map(k => q.opts[k]).join(' und ')}</b>`;
    if (q.type === 'number') return `Richtig: <b>${fmtNum(q.answer)} ${q.unit}</b>, während deine Antwort ${esc(r)} ${q.unit} war.`;
    return q.rows.map(([label, a], i) => res.ok[i] ? '' : `${label}: <b>${q.cols[a]}</b>`).filter(Boolean).join(' · ');
  }

  function resultHTML() {
    const { pts, max } = totals();
    const p = max ? pts / max : 0;
    const msg = p === 1 ? 'Weil du alles richtig hast, bist du ein echter Magnet-Profi!'
      : p >= 0.85 ? 'Stark! Du hast die Versuche richtig gut verstanden.'
      : p >= 0.65 ? 'Gut gemacht! Ein paar Dinge kannst du noch wiederholen.'
      : p >= 0.4 ? 'Eine gute Grundlage. Schau dir die Fehler unten an und übe sie noch einmal.'
      : 'Da geht noch mehr. Lies dir die Erklärungen durch und versuch es gleich noch einmal.';
    const rows = STATIONS.map(st => {
      const qs = S.queue.filter(i => QUESTIONS[i].st === st.id);
      if (!qs.length) return '';
      const sp = qs.reduce((a, i) => a + (S.res[i] ? S.res[i].score : 0), 0);
      const sm = qs.reduce((a, i) => a + maxPts(QUESTIONS[i]), 0);
      const r = sp / sm;
      const color = r === 1 ? 'var(--ok)' : r >= 0.5 ? 'var(--pen)' : 'var(--bad)';
      return `<div class="rs"><span class="rs-l">${st.label}<small>${st.title}</small></span>
        <span class="rs-bar"><i style="width:${r * 100}%;background:${color}"></i></span><span class="rs-v">${sp}/${sm}</span></div>`;
    }).join('');
    const miss = S.queue.filter(i => S.res[i] && S.res[i].score < maxPts(QUESTIONS[i]));
    const open = S.queue.filter(i => !S.res[i]);
    const missHTML = miss.length
      ? `<h3 class="sec-h">Das schaust du dir am besten noch einmal an</h3>
         <ul class="miss">${miss.map(i => {
            const q = QUESTIONS[i];
            return `<li><span class="tag">${STATIONS[q.st - 1].short}</span><div><p class="miss-q">${q.q}</p><p class="miss-a">${answerText(q, S.res[i], S.resp[i])}</p></div></li>`;
          }).join('')}</ul>`
      : open.length ? '' : `<p class="perfect">Super, dass du keinen einzigen Fehler gemacht hast!</p>`;
    const openHTML = open.length
      ? `<p class="open-note">${open.length === 1 ? 'Eine Frage hast du' : `${open.length} Fragen hast du`} noch nicht beantwortet, sodass dir dafür noch Punkte fehlen.</p>`
      : '';
    return `
      <div class="eyebrow"><span class="st">${S.mode === 'retry' ? 'Übungsrunde · Auswertung' : 'Auswertung'}</span><span>${S.queue.length} ${S.queue.length === 1 ? 'Frage' : 'Fragen'}</span></div>
      <div class="res-top"><h2 class="res-score"><span>${pts}</span>von ${max} Punkten</h2><p class="res-msg">${msg}</p></div>
      ${openHTML}
      <div class="rs-list">${rows}</div>
      ${missHTML}
      <div class="actions res-actions"><div class="btns">
        ${open.length ? `<button type="button" class="btn ghost" data-act="open" data-fk="open">Offene Fragen beantworten (${open.length})</button>` : ''}
        ${miss.length ? `<button type="button" class="btn ghost" data-act="retry" data-fk="retry">Fehler üben (${miss.length})</button>` : ''}
        <span class="spacer"></span>
        <button type="button" class="btn primary" data-act="restart" data-fk="restart">Quiz neu starten</button>
      </div></div>`;
  }

  function render() {
    const active = document.activeElement;
    const fk = pendingFocus || (active && active.dataset ? active.dataset.fk : null);
    pendingFocus = null;
    renderChrome();
    sheet.innerHTML = S.done ? resultHTML() : questionHTML();
    if (fk) {
      const el = document.querySelector(`[data-fk="${fk}"]`);
      if (el && !el.disabled) el.focus({ preventScroll: true });
      else if (fk !== 'primary') { const p = $('#primary'); if (p && !p.disabled) p.focus({ preventScroll: true }); }
    }
  }

  const behavior = reduceMotion ? 'auto' : 'smooth';
  function toSheetTop() {
    const top = sheet.getBoundingClientRect().top;
    if (top < 0) window.scrollBy({ top: top - 12, behavior });
  }
  // Nach dem Prüfen die Rückmeldung oberhalb der festen Knopfleiste zeigen; ihr Anfang hat Vorrang
  function toFeedback() {
    const fb = $('.fb', sheet), dock = $('.dock', sheet);
    if (!fb) return;
    const r = fb.getBoundingClientRect();
    const limit = window.innerHeight - (dock ? dock.offsetHeight : 0) - 12;
    const dy = Math.min(r.bottom - limit, r.top - 12);
    if (dy > 0) window.scrollBy({ top: dy, behavior });
  }

  /* ---------- Ablauf ---------- */
  function primary() {
    const qi = S.queue[S.pos], q = QUESTIONS[qi];
    if (!S.res[qi]) {
      if (!complete(q, S.resp[qi])) return;
      S.res[qi] = grade(q, S.resp[qi]);
      pendingFocus = 'primary';
      render();
      toFeedback();
    } else next();
  }

  // Springen: zu einer bestimmten Frage, zur nächsten (auch zum Überspringen) oder zur Auswertung
  function go(pos) {
    S.done = false;
    S.pos = Math.max(0, Math.min(S.queue.length - 1, pos));
    render();
    toSheetTop();
  }
  function next() { if (S.pos < S.queue.length - 1) go(S.pos + 1); else finish(); }
  function finish() { S.done = true; pendingFocus = 'restart'; render(); toSheetTop(); }

  track.addEventListener('click', e => {
    const t = e.target.closest('[data-go]');
    if (!t) return;
    pendingFocus = t.dataset.fk;
    if (t.dataset.go === 'end') finish(); else go(+t.dataset.go);
  });

  function choose(qi, q, k) {
    if (q.type !== 'multi') { S.resp[qi] = k; return; }
    const r = S.resp[qi], at = r.indexOf(k);
    if (at >= 0) r.splice(at, 1); else r.push(k);
  }

  sheet.addEventListener('click', e => {
    const t = e.target.closest('button');
    if (!t || t.disabled) return;
    if (t.dataset.act === 'restart') { S = freshState(allIdx(), 'all'); pendingFocus = 'primary'; render(); toSheetTop(); return; }
    if (t.dataset.act === 'retry') {
      const miss = S.queue.filter(i => S.res[i] && S.res[i].score < maxPts(QUESTIONS[i]));
      S = freshState(miss, 'retry'); pendingFocus = 'primary'; render(); toSheetTop(); return;
    }
    if (t.dataset.act === 'open') { pendingFocus = 'primary'; go(S.queue.findIndex(i => !S.res[i])); return; }
    if (S.done) return;
    const qi = S.queue[S.pos], q = QUESTIONS[qi];
    if (t.dataset.act === 'prev') { go(S.pos - 1); return; }
    if (t.dataset.act === 'next') { next(); return; }
    if (t.id === 'primary') { primary(); return; }
    if (S.res[qi]) return;
    if (t.dataset.opt != null) { choose(qi, q, +t.dataset.opt); render(); return; }
    if (t.dataset.cell) { const [ri, ci] = t.dataset.cell.split(',').map(Number); S.resp[qi][ri] = ci; render(); }
  });

  sheet.addEventListener('input', e => {
    if (e.target.id !== 'num' || S.done) return;
    const qi = S.queue[S.pos];
    S.resp[qi] = e.target.value;
    const p = $('#primary');
    if (p) p.disabled = !complete(QUESTIONS[qi], S.resp[qi]);
  });

  document.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey || !S) return;
    const tag = e.target.tagName;
    if (e.key === 'Enter' && tag !== 'BUTTON' && tag !== 'A') {
      const p = $('#primary');
      if (p && !p.disabled) { e.preventDefault(); p.click(); }
      return;
    }
    if (S.done || tag === 'INPUT') return;
    if (e.key === 'ArrowLeft' && S.pos > 0) { go(S.pos - 1); return; }
    if (e.key === 'ArrowRight') { next(); return; }
    if (e.key.length !== 1) return;
    const qi = S.queue[S.pos], q = QUESTIONS[qi];
    if ((q.type !== 'mc' && q.type !== 'multi') || S.res[qi]) return;
    let j = '1234'.indexOf(e.key);
    if (j < 0) j = 'abcd'.indexOf(e.key.toLowerCase());
    if (j >= 0 && j < S.order[qi].length) { const k = S.order[qi][j]; choose(qi, q, k); pendingFocus = `opt${k}`; render(); }
  });

  function start(data) {
    S = data && validState(data.S) ? data.S : freshState(allIdx(), 'all');
    if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') {
      window.claude.hot.snapshot(() => ({ S }));
    }
    render();
  }

  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
